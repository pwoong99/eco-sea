<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 함께 지키는 바다</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Jua', 'Malgun Gothic', sans-serif; background: linear-gradient(#a6e3ff, #e3f7ff); color: #33405a; min-height: 100vh; padding: 30px 20px; }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-weight: normal; font-size: 32px; margin-bottom: 6px; }
    .mode { color: #6b7890; margin-bottom: 20px; }
    .box { background: #fffcf4; border-radius: 24px; padding: 22px; margin-bottom: 18px; box-shadow: 0 6px 0 rgba(47,143,208,.2); }
    h2 { font-weight: normal; font-size: 22px; margin-bottom: 12px; }
    input { font-family: inherit; font-size: 18px; padding: 10px 14px; border: 3px solid #d6e2ef; border-radius: 14px; margin: 4px; width: 260px; }
    button { font-family: inherit; font-size: 17px; padding: 10px 18px; border-radius: 999px; border: none; cursor: pointer; margin: 4px; background: #2f8fd0; color: #fff; box-shadow: 0 4px 0 #1f6aa3; }
    button.gray { background: #fff; color: #33405a; box-shadow: 0 4px 0 #c9d6e6; border: 2px solid #e3ebf5; }
    button.red { background: #ff6b6b; box-shadow: 0 4px 0 #d94a4a; }
    button.small { font-size: 14px; padding: 5px 12px; }
    .stats { display: flex; gap: 14px; flex-wrap: wrap; }
    .stat { flex: 1; min-width: 150px; background: #fff; border-radius: 16px; padding: 12px; text-align: center; }
    .stat b { display: block; font-size: 28px; font-weight: normal; color: #2f8fd0; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #eef2f7; text-align: left; font-size: 16px; }
    th { background: #eef6fd; font-weight: normal; }
    .ko { color: #e0566a; } .my { color: #1d8f82; }
    .msg { margin-top: 8px; color: #e04d4d; min-height: 1.3em; }
    .filter { margin-bottom: 10px; }
    .hidden { display: none; }
    a { color: #2f8fd0; }
    .set-row { display: flex; align-items: center; gap: 14px; margin: 10px 0; font-size: 18px; }
    .set-row label { width: 150px; }
    .set-row input[type=range] { flex: 1; width: auto; accent-color: #2f8fd0; border: none; padding: 0; }
    .set-val { width: 70px; text-align: right; font-weight: normal; color: #2f8fd0; font-size: 22px; }
    .set-est { color: #6b7890; margin: 4px 0 12px; }
    .msg.ok { color: #1f9a5c; }
    .sub-h { font-weight: normal; font-size: 20px; margin: 22px 0 6px; padding-top: 16px; border-top: 2px dashed #e3ebf5; }
    .hint { color: #6b7890; margin-bottom: 6px; } .hint b { color: #e0566a; font-weight: normal; }
    .hint-inline { color: #6b7890; font-size: 15px; }
    .set-row input.wide { flex: 1; width: auto; }
    .set-row input.num { width: 110px; }
    .set-row label.switch, .switch { position: relative; width: 56px; flex: 0 0 56px; height: 30px; display: inline-block; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; background: #cfd8e3; border-radius: 999px; transition: .2s; cursor: pointer; }
    .switch span::before { content: ''; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + span { background: #34c27a; }
    .switch input:checked + span::before { transform: translateX(26px); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🌊 함께 지키는 바다 · 관리자</h1>
    <p class="mode" id="mode"></p>

    <div class="box hidden" id="loginBox">
      <h2>🔐 관리자 로그인</h2>
      <p style="margin-bottom:10px;color:#6b7890">Firebase Authentication에 등록한 관리자 이메일로 로그인하세요.</p>
      <input id="email" type="email" placeholder="관리자 이메일">
      <input id="pw" type="password" placeholder="비밀번호">
      <button id="btnLogin">로그인</button>
      <p class="msg" id="loginMsg"></p>
    </div>

    <div id="adminArea" class="hidden">
      <div class="box">
        <h2>⚙️ 게임 설정</h2>
        <div class="set-row">
          <label for="setSec">한 문제 제한 시간</label>
          <input id="setSec" type="range" min="3" max="20" step="1">
          <b id="setSecVal" class="set-val"></b>
        </div>
        <div class="set-row">
          <label for="setRounds">한 판 문제 수</label>
          <input id="setRounds" type="range" min="3" max="20" step="1">
          <b id="setRoundsVal" class="set-val"></b>
        </div>
        <p class="set-est" id="setEst"></p>

        <h3 class="sub-h">🎉 누적 실천 당첨 이벤트</h3>
        <p class="hint">한국·말레이시아 친구들의 <b>누적 실천 수</b>가 정한 숫자를 넘기는 판에서, 그 판을 한 친구에게 당첨 축하 화면이 떠요.</p>
        <div class="set-row">
          <label for="prizeOn">사용</label>
          <label class="switch"><input type="checkbox" id="prizeOn"><span></span></label>
          <span id="prizeOnTxt" class="hint-inline"></span>
        </div>
        <div class="set-row">
          <label for="prizeList">당첨 숫자</label>
          <input id="prizeList" type="text" placeholder="예: 50, 100, 200" class="wide">
        </div>
        <div class="set-row">
          <label for="prizeEvery">그 뒤로 반복</label>
          <input id="prizeEvery" type="number" min="0" max="100000" step="10" class="num"> <span class="hint-inline">개마다 계속 당첨 (0이면 반복 안 함)</span>
        </div>
        <div class="set-row">
          <label for="prizeMsg">안내 문구</label>
          <input id="prizeMsg" type="text" maxlength="60" class="wide" placeholder="예: 부스 선생님께 와서 선물을 받아 가세요!">
        </div>
        <p class="set-est" id="prizePreview"></p>
        <div>
          <button id="btnSaveSet">💾 설정 저장</button>
          <button class="gray" id="btnDefaultSet">기본값으로</button>
          <button class="gray" id="btnPrizeTest">🎉 축하 화면 미리보기</button>
        </div>
        <p class="msg ok" id="setMsg"></p>
      </div>
      <div class="box">
        <h2>📊 누적 현황</h2>
        <div class="stats" id="stats"></div>
        <div style="margin-top:12px">
          <button class="gray" id="btnReload">🔄 새로고침</button>
          <button class="red" id="btnDelToday">오늘 기록 모두 삭제</button>
          <button class="red" id="btnDelAll">전체 기록 모두 삭제</button>
          <button class="red" id="btnResetStats">누적 실천 수 0으로</button>
          <button class="gray hidden" id="btnLogout">로그아웃</button>
        </div>
        <p class="msg" id="adminMsg"></p>
      </div>

      <div class="box">
        <h2>🏅 당첨 기록 <small style="color:#8a96a8">(최근 순)</small></h2>
        <table>
          <thead><tr><th>시간</th><th>당첨 숫자</th><th>별명</th><th>나라</th><th>모드</th><th></th></tr></thead>
          <tbody id="prizeRows"></tbody>
        </table>
      </div>

      <div class="box">
        <h2>📋 기록 목록 <small style="color:#8a96a8">(최근 순, 부적절한 별명은 삭제하세요)</small></h2>
        <div class="filter">
          <label><input type="checkbox" id="onlyToday" checked style="width:auto"> 오늘 기록만 보기</label>
        </div>
        <table>
          <thead><tr><th>시간</th><th>별명</th><th>나라</th><th>모드</th><th>실천</th><th>점수</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p><a href="index.html">← 게임으로 돌아가기</a></p>
    </div>
  </div>

  <script type="module" src="js/admin.js?v=1.5.1"></script>
</body>
</html>
